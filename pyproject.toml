[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "bramble"
version = "0.1.0"
description = "A GraphQL library for Python with a Rust-based parser/validator"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
dynamic = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.maturin]
manifest-path = "crates/bramble/Cargo.toml"
module-name = "bramble._bramble"
