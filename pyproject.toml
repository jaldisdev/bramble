[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "bramble"
version = "0.1.0"
authors = [
    { name = "Mario Ritzerfeld" }
]
description = "A GraphQL library for Python with a Rust-based parser/validator"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
dynamic = []

[project.optional-dependencies]
asgi = ["python-multipart>=0.0.9"]
starlette = ["starlette>=0.37", "python-multipart>=0.0.9"]
fastapi = ["fastapi>=0.100", "python-multipart>=0.0.9"]
flask = ["flask>=2.0", "asgiref>=3.7", "python-multipart>=0.0.9"]
django = ["django>=4.2", "channels>=4.0", "python-multipart>=0.0.9"]
cli = ["click>=8.1", "uvicorn>=0.30", "bramble[starlette]"]
dev = [
    "pytest",
    "bramble[cli,asgi,starlette,fastapi,flask,django]",
    "httpx>=0.27",
    "httpx2>=2.0",
    "channels[daphne]>=4.0",
]

[project.scripts]
bramble = "bramble.cli.app:main"

[tool.maturin]
manifest-path = "crates/bramble-py/Cargo.toml"
module-name = "bramble._bramble"
# Not a default Cargo feature: it would break `cargo test`, which has to link libpython.
features = ["extension-module"]
