[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "bramble"
version = "0.1.0"
description = "A GraphQL library for Python with a Rust-based parser/validator"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
dynamic = []

[project.optional-dependencies]
cli = ["click>=8.1", "starlette>=0.37", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest", "bramble[cli]", "httpx>=0.27", "httpx2>=2.0"]

[project.scripts]
bramble = "bramble.cli.app:main"

[tool.maturin]
manifest-path = "crates/bramble/Cargo.toml"
module-name = "bramble._bramble"
