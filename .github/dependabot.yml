version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # The entries in `[project.optional-dependencies]` are *floors* -- the oldest release whose
    # API the corresponding adapter or command actually uses -- not pins. Raising them to whatever
    # is newest would drop downstream users for no gain, so version-updates are ignored here.
    # `ignore` only suppresses version-updates: security advisories still open PRs, which is the
    # only reason we'd want to move one of these floors. Deliberately absent: `python-multipart`
    # (bramble calls `parse_form` on untrusted request bodies, so its bumps want a real look) and
    # the `dev`-only entries, which no downstream install has to satisfy.
    ignore:
      - dependency-name: flask
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: fastapi
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: starlette
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: django
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: channels
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: asgiref
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: click
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
