name: CI

on:
  push:
    branches: [canary, main]
  pull_request:

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  cargo-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo bench --workspace
      # Criterion's own HTML/JSON report becomes a downloadable per-run artifact -- a baseline
      # record without needing a dedicated benchmark-tracking service (e.g. a gh-pages branch);
      # comparing runs over time is still a manual "download both, diff" step for now.
      - uses: actions/upload-artifact@v4
        with:
          name: criterion-benchmark-results
          path: target/criterion

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest
