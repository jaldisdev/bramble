name: CI

on:
  push:
    branches: [canary, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: cargo fmt --check
      # `--all-targets` so tests and benches are linted too, not just the library.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # `bramble-py`'s own tests start an embedded interpreter and `import bramble` from the repo
      # root, so the compiled extension has to exist before `cargo test` runs. `-e` places
      # `bramble/_bramble.abi3.so` in the source tree, which is where those tests look for it.
      - run: pip install -e "."
      # Single-threaded: `bramble-py`'s tests share one embedded Python interpreter, and concurrent
      # imports across cargo's test threads trip Python's own import-deadlock detection.
      - run: cargo test --workspace -- --test-threads=1

  cargo-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo bench --workspace
      # Criterion's own HTML/JSON report becomes a downloadable per-run artifact -- a baseline
      # record without needing a dedicated benchmark-tracking service (e.g. a gh-pages branch);
      # comparing runs over time is still a manual "download both, diff" step for now.
      - uses: actions/upload-artifact@v7
        with:
          name: criterion-benchmark-results
          path: target/criterion

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest
