[package]
name = "bramble-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings exposing bramble-core to Python. Not useful standalone; see the `bramble` package on PyPI."
readme = "README.md"
keywords = ["graphql", "pyo3", "python", "bindings"]
categories = ["api-bindings", "web-programming"]

[lib]
name = "_bramble"
# `rlib` alongside `cdylib` so the crate can be linked into a Rust test binary at all -- a
# cdylib-only crate builds no test harness, which is why this crate had zero Rust tests.
crate-type = ["cdylib", "rlib"]
path = "src/bramble_py.rs"

[features]
# NOT enabled by default. `pyo3/extension-module` tells the linker not to link libpython (correct
# for a Python extension, since the interpreter provides those symbols), but a `cargo test` binary
# has no interpreter hosting it and fails to link. maturin turns it on for real wheel builds via
# `[tool.maturin] features` in pyproject.toml.
extension-module = ["pyo3/extension-module"]

[dependencies]
bramble-core = { path = "../bramble-core" }
async-graphql-parser = "7.2.1"
async-graphql-value = "7.2.1"
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
serde_json = "1.0.151"

[dev-dependencies]
# `auto-initialize` starts an interpreter on demand so `Python::attach` works in a plain test
# binary, without a Python process already hosting it.
pyo3 = { version = "0.29.0", features = ["abi3-py310", "auto-initialize"] }
